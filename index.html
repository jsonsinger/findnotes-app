<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find Notes</title>
  <meta name="description" content="Lists that can grow into notes.">
  <meta name="color-scheme" content="dark">
  <script>try{if(localStorage.getItem("find-notes:theme")==="light")document.documentElement.dataset.theme="light"}catch{}</script>
  <meta name="theme-color" content="#171716">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite: define each icon once, reuse it with <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flame" viewBox="0 0 24 24">
      <path d="M12 12c2-2.96 0-7-1-8 0 3.038-1.773 4.741-3 6-1.226 1.26-2 3.24-2 5a6 6 0 1 0 12 0c0-1.532-1.056-3.94-2-5-1.786 3-2.791 3-4 2z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10" cy="10" r="6.5"/><path d="M20 20l-5.2-5.2"/>
    </symbol>
    <symbol id="i-dots" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"/>
    </symbol>
    <symbol id="i-archive" viewBox="0 0 24 24">
        <path d="M3.5 5h17v4h-17zM5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>
    </symbol>
    <symbol id="i-restore" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M15 5l-7 7 7 7"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="i-note" viewBox="0 0 24 24">
        <path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M8.5 13h7M8.5 17h5"/>
    </symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>
    </symbol>
    <symbol id="i-compass" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>
    </symbol>
    <symbol id="i-mountain" viewBox="0 0 24 24">
      <path d="M3 19L9.5 8l3.5 5.5 2-3L21 19H3z"/>
    </symbol>
    <symbol id="i-map" viewBox="0 0 24 24">
      <path d="M9 4L3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"/>
    </symbol>
    <symbol id="i-tent" viewBox="0 0 24 24">
      <path d="M3 19L12 5l9 14H3zM12 5v14"/>
    </symbol>
    <symbol id="i-anchor" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2"/><path d="M12 7v13M6 12H4c0 4.4 3.6 8 8 8s8-3.6 8-8h-2M9 11h6"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
    </symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24">
      <path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14zM5 19c3-5 6-8 10-10"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9l-5.3 2.7 1-5.8-4.2-4.1 5.9-.9z"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path d="M12 20s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.5 4.5 4.5 0 0 1 19.5 10C19.5 15.4 12 20 12 20z"/>
    </symbol>
  </svg>

  <div id="app">
    <header class="header" id="header">
      <div class="whos" id="whos">
        <button class="who" id="who" aria-label="Edit list name and icon" aria-haspopup="dialog">
          <span class="tile">
            <svg class="icon" aria-hidden="true"><use id="tile-icon" href="#i-list"/></svg>
          </span>
          <h1 id="title">Find Notes</h1>
        </span>
      </div>
      <button class="icon-btn" id="search-btn" aria-label="Search">
        <svg class="icon"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn" id="menu-btn" aria-label="List options" aria-haspopup="true" aria-expanded="false">
        <svg class="icon"><use href="#i-dots"/></svg>
      </button>
    </header>

    <div class="banner" id="banner" role="alert" hidden>
      <span id="banner-text"></span>
      <button id="banner-action"></button>
    </div>

    <div class="stage" id="stage">
        <main class="list" id="list" role="list"></main>
    </div>
    <nav class="dots" id="dots" aria-label="Lists" hidden></nav>
    <div class="selbar" id="selbar" hidden>
        <div class="sel-fill" id="sel-fill"></div>
        <span class="sel-hint" id="sel-hint"></span>
        <button class="sel-knob" id="sel-knob" aria-label="Archive selected">
            <svg class="icon" aria-hidden="true"><use href="#i-archive"/></svg>
            <span class="sel-label">Archive</span>
        </button>
        <button class="sel-x" id="sel-x" aria-label="Clear selection">
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
    </div>


    <button class="addbar" id="add">
        <span>Add an item</span>
        <span class="addbar-plus" aria-hidden="true"><svg class="icon"><use href="#i-plus"/></svg></span>
    </button>

    <div class="scrim" id="scrim"></div>
    <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="New item">
        <button class="grab" id="grab" aria-label="Expand note" aria-expanded="false"><span></span></button>
        <div class="drawer-top" id="drawer-top">
            <span id="hint"><svg class="icon hint-icon" id="hint-icon" aria-hidden="true" hidden><use href="#i-clock"/></svg><span id="hint-text"></span></span>
            <span class="drawer-actions">
                <button class="icon-btn" id="trash" aria-label="Delete item" hidden>
                    <svg class="icon" aria-hidden="true"><use id="trash-icon" href="#i-archive"/></svg>
                </button>
                <button class="icon-btn" id="bookmark" aria-label="Bookmark" aria-pressed="false">
                    <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
                </button>
                <button class="icon-btn" id="done" aria-label="Add" data-state="plus">
                    <svg class="icon" aria-hidden="true"><use id="done-icon" href="#i-plus"/></svg>
                </button>
            </span>
        </div>
        <input id="item-title" type="text" placeholder="What do you need to do?" autocomplete="off" enterkeyhint="next">
        <div class="meta" id="meta">
            <span id="meta-list"></span>
            <span id="meta-date"></span>
        </div>
        <textarea id="item-body" placeholder="Add a description"></textarea>
    </section>
       <div class="menu-scrim" id="menu-scrim" hidden></div>
   <div class="menu" id="menu" hidden>
     <button data-action="all">All lists</button>
     <button data-action="new">New list</button>
     <button data-action="edit">Edit list</button>
     <hr>
     <button data-action="archive">Archive</button>
     <button data-action="settings">Settings</button>
   </div>

   <div class="menu-scrim" id="edit-scrim" hidden></div>
   <div class="listedit" id="listedit" role="dialog" aria-label="Edit list" hidden>
     <input class="title-input" id="title-input" type="text" maxlength="40" aria-label="List name" autocomplete="off" enterkeyhint="done">
     <div class="icon-grid" id="icon-grid" role="radiogroup" aria-label="List icon"></div>
     <div class="selbar inline" id="edit-slide">
       <div class="sel-fill"></div>
       <span class="sel-hint">Slide to archive</span>
       <button class="sel-knob" aria-label="Archive this list">
         <svg class="icon" aria-hidden="true"><use href="#i-archive"/></svg>
         <span class="sel-label">Archive</span>
       </button>
     </div>
   </div>

   <section class="screen" id="all-lists" role="dialog" aria-modal="true" aria-label="All lists" hidden>
     <header class="header">
       <h2>All lists</h2>
     </header>
     <div class="screen-body">
       <div id="all-rows"></div>
     </div>
     <button class="addbar" id="all-new">
       <span>Add a list</span>
       <span class="addbar-plus" aria-hidden="true"><svg class="icon"><use href="#i-plus"/></svg></span>
     </button>
   </section>
   <section class="screen" id="archive" role="dialog" aria-modal="true" aria-label="Archive" hidden>
     <header class="header">
       <button class="icon-btn" id="archive-back" aria-label="Back">
         <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
       </button>
       <h2>Archive</h2>
     </header>
     <div class="screen-body" id="archive-body"></div>
   </section>
   <section class="screen" id="search" role="dialog" aria-modal="true" aria-label="Search" hidden>
     <header class="header">
       <button class="icon-btn" id="search-back" aria-label="Back">
         <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
       </button>
       <input class="search-input" id="search-input" type="search" placeholder="Search all lists" aria-label="Search all lists" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
     </header>
     <div class="screen-body" id="search-body"></div>
   </section>
   <section class="screen" id="settings" role="dialog" aria-modal="true" aria-label="Settings" hidden>
     <header class="header">
       <button class="icon-btn" id="settings-back" aria-label="Back">
         <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
       </button>
       <h2>Settings</h2>
     </header>
     <div class="screen-body">
       <h3 class="arch-heading">Appearance</h3>
       <div class="setting">
         <span>Theme</span>
         <div class="seg" id="theme-seg" role="radiogroup" aria-label="Theme">
           <button role="radio" data-theme-choice="dark">Dark</button>
           <button role="radio" data-theme-choice="light">Light</button>
         </div>
       </div>
       <h3 class="arch-heading">Backup</h3>
       <p class="setting-note">Your notes live only on this device. A backup is a file you can keep somewhere safe and bring back later.</p>
       <div class="setting"><button class="setting-btn" id="export-btn">Export a backup</button></div>
       <div class="setting"><button class="setting-btn" id="import-btn">Restore from a backup</button></div>
       <input type="file" id="import-file" accept="application/json,.json" hidden>
       <p class="setting-note" id="backup-status" role="status"></p>
       <h3 class="arch-heading">About</h3>
       <div class="setting"><span>Version</span><span class="setting-value" id="version"></span></div>
       <div class="setting"><span>Storage</span><span class="setting-value" id="persist-status">Checking</span></div>
     </div>
   </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
